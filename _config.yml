# Jekyll configuration for GitHub Pages

# Exclude directories that contain large files, model outputs, and symlink chains.
# These exclusions prevent Jekyll build failures that occur when:
# - Jekyll encounters symlinks to files outside the repository during site generation
# - Large binary files (.pth, .tar) cause processing timeouts
# - Python code and data files are unnecessarily processed
exclude:
  - eval/
  - output/
  - results/
  - logs/
  - data/
  - scripts/
  - configs/
  - src/
  - trained_models/
  - evaluation_suite/
  - __pycache__/
  - wandb/
  - "*.py"
  - "*.pth"
  - "*.tar"
  - "*.log"
  - "*.pkl"
  - "*.skeleton"
  - "*.npz"
  - "*.out"
  - "*.err"
  - Makefile
