# Jekyll configuration for GitHub Pages

# Exclude directories that contain large files, model outputs, or broken symlinks
# These exclusions prevent Jekyll from processing files that cause build errors
# or are not intended for the GitHub Pages site
exclude:
  - eval/
  - output/
  - results/
  - logs/
  - data/
  - scripts/
  - configs/
  - src/
  - trained_models/
  - evaluation_suite/
  - __pycache__/
  - wandb/
  - "*.py"
  - "*.pth"
  - "*.tar"
  - "*.log"
  - "*.pkl"
  - "*.skeleton"
  - "*.npz"
  - "*.out"
  - "*.err"
  - Makefile
