# Main Configuration for Transformer Retargeting Project
# This file contains all the unified configuration settings

# Project Information
project:
  name: "Transformer Retargeting"
  version: "2.0.0"
  description: "Unified and consolidated transformer-based motion retargeting system"

# Directory Structure
directories:
  src: "src"
  scripts: "scripts"
  docs: "docs"
  configs: "configs"
  data: "data"
  results: "results"
  evaluation_suite: "evaluation_suite"
  logs: "logs"
  checkpoints: "checkpoints"

# Supported Datasets
datasets:
  ntu:
    name: "NTU RGB+D"
    num_classes: 60
    num_joints: 25
    settings: ["cs", "cv"]
    data_path: "data/ntu"
    raw_data_path: "data/nturgbd_raw"
    skeleton_dir: "nturgb+d_skeletons"
    processed_files:
      cs: "ntu_cs_processed.pkl"
      cv: "ntu_cv_processed.pkl"
  ntu120:
    name: "NTU RGB+D 120"
    num_classes: 120
    num_joints: 25
    settings: ["cs", "cv"]
    data_path: "data/ntu120"
    raw_data_path: "data/nturgbd_raw"
    skeleton_dir: "nturgb+d_skeletons120"
    # NTU120 also uses NTU60 data
    includes_ntu60: true
    ntu60_skeleton_dir: "nturgb+d_skeletons"
    processed_files:
      cs: "ntu120_cs_processed.pkl"
      cv: "ntu120_cv_processed.pkl"
  etri:
    name: "ETRI"
    num_classes: 55
    num_joints: 25
    settings: ["cs", "cv"]
    data_path: "data/etri"
    raw_data_path: "data/etri_raw"
    processed_files:
      cs: "etri_cs_processed.pkl"
      cv: "etri_cv_processed.pkl"

# Model Architectures
models:
  transformer:
    name: "Transformer Autoencoder"
    encoder_path: "src/model/encoder.py"
    decoder_path: "src/model/decoder.py"
    autoencoder_path: "src/model/autoencoder.py"
  sgn:
    name: "Spatial-Temporal Graph Neural Network"
    model_path: "src/model/sgn.py"
  mixformer:
    name: "MixFormer"
    spatial_path: "src/model/spa_mixf.py"
    temporal_path: "src/model/tem_mixf.py"
    skeleton_path: "src/model/ske_mixf.py"

# Training Configuration
training:
  default_epochs: 100
  default_batch_size: 128
  default_lr: 1e-5
  default_device: "cuda"
  checkpoint_every: 1
  validation_frequency: 1
  
  # Loss weights (default values)
  loss_weights:
    mse: 7.0
    l1: 0.0
    smoothl1: 0.0
    kl: 0.0
    ce: 0.0
    ee: 5.0
    smoothing: 0.075
    latent: 0.0
    triplet: 0.0
    inception: 0.05
    fid_vel: 1.0
    bone: 10.0
    foot: 3.0
    joint_limit: 1.0

# Pretraining Configuration
pretraining:
  encoder:
    epochs: 50
    batch_size: 256
    lr: 1e-4
    masking_ratios:
      temporal: [0.3, 0.5, 0.7]
      spatial: [0.3, 0.5, 0.7]
  
  dmr_pmr:
    epochs: 100
    batch_size: 128
    lr: 1e-5
  
  sgn_mixformer:
    epochs: 150
    batch_size: 64
    lr: 1e-4

# Evaluation Configuration
evaluation:
  tasks:
    - "action_recognition"
    - "re_identification" 
    - "gesture_classification"
  
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "mse"
    - "physical_plausibility"
  
  batch_size: 64
  num_workers: 4

# HPC Configuration
hpc:
  default_partition: "GPU"
  default_time: "240:00:00"
  default_nodes: 1
  default_ntasks_per_node: 4
  default_gres: "gpu:4"
  default_mem: "200GB"
  
  job_templates:
    quick:
      time: "4:00:00"
      mem: "64GB"
      gres: "gpu:1"
      ntasks_per_node: 1
    standard:
      time: "12:00:00"
      mem: "128GB"
      gres: "gpu:2"
      ntasks_per_node: 2
    long:
      time: "48:00:00"
      mem: "200GB"
      gres: "gpu:4"
      ntasks_per_node: 4

# Environment Requirements
requirements:
  python_version: ">=3.8"
  required_packages:
    - "torch>=1.9.0"
    - "numpy>=1.21.0"
    - "scipy>=1.7.0"
    - "matplotlib>=3.4.0"
    - "seaborn>=0.11.0"
    - "pandas>=1.3.0"
    - "pyyaml>=5.4.0"
    - "tqdm>=4.61.0"
    - "wandb>=0.12.0"
  
  optional_packages:
    - "optuna>=2.10.0"
    - "tensorboard>=2.6.0"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_rotation: true
  max_file_size: "100MB"
  backup_count: 5

# Interactive CLI Configuration
interactive:
  default_mode: false
  show_progress: true
  confirm_actions: true
  max_display_items: 20

# Step Completion Detection
step_completion:
  preprocess:
    # Check for processed data files
    check_files:
      - "{data_path}/{processed_files[setting]}"
    description: "Processed data files exist"

  sample:
    # Check for sampled data files
    check_files:
      - "data/{dataset}_{setting}_paired_50000_5000.pt"
      - "data/{dataset}_{setting}_paired.pt"
    description: "Sampled paired data files exist"

  pretrain:
    # Check for pretrained models
    check_files:
      - "eval/mixformer/pretrained/{dataset}/encoder_{setting}.pth"
      - "eval/mixformer/pretrained/{dataset}/encoder_{setting}_comprehensive.pth"
      - "eval/dmr/{dataset}.pt"
      - "eval/pmr/{dataset}.pt"
    description: "Pretrained models exist"

  train:
    # Check for trained models
    check_files:
      - "trained_models/{dataset}_{setting}_best.pth"
      - "model.pth"
      - "checkpoints/checkpoint_best.pth"
    description: "Trained models exist"

  evaluate:
    # Check for evaluation results
    check_files:
      - "results/evaluation_complete_{dataset}_{setting}.json"
      - "evaluation_suite/results/comprehensive_evaluation.json"
    description: "Evaluation results exist"
