# Main Configuration for Transformer Retargeting Project
# This file contains all the unified configuration settings

# Project Information
project:
  name: "Transformer Retargeting"
  version: "2.0.0"
  description: "Unified and consolidated transformer-based motion retargeting system"

# Directory Structure
directories:
  src: "src"
  scripts: "scripts"
  configs: "configs"
  data: "data"
  output: "output"
  results: "results"
  logs: "logs"

# Supported Datasets
datasets:
  ntu:
    name: "NTU RGB+D"
    num_classes: 60
    num_joints: 25
    settings: ["cs", "cv"]
    data_path: "data/ntu"
    raw_data_path: "data/nturgbd_raw"
    skeleton_dir: "nturgb+d_skeletons"
    processed_files:
      cs: "ntu_cs_processed.pkl"
      cv: "ntu_cv_processed.pkl"
  ntu120:
    name: "NTU RGB+D 120"
    num_classes: 120
    num_joints: 25
    settings: ["cs", "cv"]
    data_path: "data/ntu120"
    raw_data_path: "data/nturgbd_raw"
    skeleton_dir: "nturgb+d_skeletons120"
    # NTU120 also uses NTU60 data
    includes_ntu60: true
    ntu60_skeleton_dir: "nturgb+d_skeletons"
    processed_files:
      cs: "ntu120_cs_processed.pkl"
      cv: "ntu120_cv_processed.pkl"
  etri:
    name: "ETRI"
    num_classes: 55
    num_joints: 25
    settings: ["cs", "cv"]
    data_path: "data/etri"
    raw_data_path: "data/etri_raw"
    processed_files:
      cs: "etri_cs_processed.pkl"
      cv: "etri_cv_processed.pkl"

# Model Architectures
models:
  transformer:
    name: "Transformer Autoencoder"
    encoder_path: "src/model/encoder.py"
    decoder_path: "src/model/decoder.py"
    autoencoder_path: "src/model/autoencoder.py"
  sgn:
    name: "Spatial-Temporal Graph Neural Network"
    model_path: "src/model/sgn.py"
  mixformer:
    name: "MixFormer"
    spatial_path: "src/model/spa_mixf.py"
    temporal_path: "src/model/tem_mixf.py"
    skeleton_path: "src/model/ske_mixf.py"

# Training Configuration
training:
  default_epochs: 100
  default_batch_size: 64  # OPTIMIZED: From Optuna study parallel_optuna_20251024_002759 (trial 52)
  default_lr: 1.1893075293522976e-05  # OPTIMIZED: From Optuna study parallel_optuna_20251024_002759 (trial 52)
  weight_decay: 9.689062322279026e-05  # OPTIMIZED: From Optuna study parallel_optuna_20251024_002759 (trial 52)
  default_device: "cuda"
  checkpoint_every: 1
  validation_frequency: 1
  decoder_dropout: 0.11551063114920847  # OPTIMIZED: From hyperparameter tuning (trial 17)

  # Disentanglement Loss Weights (OPTIMIZED: From Optuna study parallel_optuna_20251024_002759, trial 52)
  disentanglement_weights:
    contrastive: 0.7639668649851091  # InfoNCE contrastive loss
    adversarial: 1.530060362292714   # Identity discriminator adversarial loss
    orthogonality: 0.6165893505805403  # Feature orthogonality loss
    mutual_info: 0.5844976897706137  # Mutual information minimization loss
    ar: 0.5448186952333649  # Action recognition loss
    ri: 0.9984603149063558  # Re-identification loss

  # Reconstruction Loss Weights (OPTIMIZED: From hyperparameter tuning trial 17)
  loss_weights:
    mse: 5.323284271000699  # OPTIMIZED: From hyperparameter tuning
    l1: 0.0
    smoothl1: 0.0
    kl: 0.0
    ce: 0.0
    ee: 4.7250245075017725  # OPTIMIZED: From hyperparameter tuning
    smoothing: 2.8747697025246937  # OPTIMIZED: From hyperparameter tuning (exact value)
    latent: 0.0
    triplet: 0.0
    inception: 3.0656068713914353  # OPTIMIZED: From hyperparameter tuning (exact value)
    fid_vel: 2.2608337791442894  # OPTIMIZED: From hyperparameter tuning (exact value)
    bone: 6.185377286837532  # OPTIMIZED: From hyperparameter tuning (exact value)
    foot: 0.544125368059208  # OPTIMIZED: From hyperparameter tuning (exact value)
    joint_limit: 1.768344443841404  # OPTIMIZED: From hyperparameter tuning (exact value)

# Pretraining Configuration
pretraining:
  encoder:
    epochs: 50
    batch_size: 256
    lr: 1e-4
    masking_ratios:
      temporal: [0.3, 0.5, 0.7]
      spatial: [0.3, 0.5, 0.7]
  
  dmr_pmr:
    epochs: 100
    batch_size: 128
    lr: 1e-5
  
  sgn_mixformer:
    epochs: 150
    batch_size: 64
    lr: 1e-4
    mixed_precision: false  # DISABLED: Mixed precision causes NaN gradients due to scaling issues
    gradient_accumulation_steps: 4
    max_grad_norm: 1.0

# Evaluation Configuration
evaluation:
  tasks:
    - "action_recognition"
    - "re_identification" 
    - "gesture_classification"
  
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "mse"
    - "physical_plausibility"
  
  batch_size: 64
  num_workers: 4

# HPC Configuration
hpc:
  default_partition: "GPU"
  default_time: "240:00:00"
  default_nodes: 1
  default_ntasks_per_node: 4
  default_gres: "gpu:4"
  default_mem: "200GB"

  job_templates:
    quick:
      time: "4:00:00"
      mem: "64GB"
      gres: "gpu:1"
      ntasks_per_node: 1
    standard:
      time: "48:00:00"
      mem: "64GB"
      gres: "gpu:1"
      ntasks_per_node: 1
    long:
      time: "240:00:00"
      mem: "200GB"
      gres: "gpu:4"
      ntasks_per_node: 4

# Environment Requirements
requirements:
  python_version: ">=3.8"
  required_packages:
    - "torch>=1.9.0"
    - "numpy>=1.21.0"
    - "scipy>=1.7.0"
    - "matplotlib>=3.4.0"
    - "seaborn>=0.11.0"
    - "pandas>=1.3.0"
    - "pyyaml>=5.4.0"
    - "tqdm>=4.61.0"
    - "wandb>=0.12.0"
  
  optional_packages:
    - "optuna>=2.10.0"
    - "tensorboard>=2.6.0"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_rotation: true
  max_file_size: "100MB"
  backup_count: 5

# Interactive CLI Configuration
interactive:
  default_mode: false
  show_progress: true
  confirm_actions: true
  max_display_items: 20

# Step Completion Detection
step_completion:
  preprocess:
    # Check for processed data files
    check_files:
      - "{data_path}/{processed_files[setting]}"
    description: "Processed data files exist"

  sample:
    # Check for sampled data files
    check_files:
      - "data/{dataset}_{setting}_paired_50000_5000.pt"
      - "data/{dataset}_{setting}_paired.pt"
    description: "Sampled paired data files exist"

  pretrain:
    # Check for pretrained models
    check_files:
      - "output/{dataset}_sgn_ar_paired/model_best.pth.tar"
      - "output/{dataset}_mixformer_ar_paired/model_best.pth.tar"
    description: "Downstream AR/RI backbones available"

  train:
    # Check for trained models
    check_files:
      - "output/disentangled_tmr/checkpoint_stage3_best.pth"
    description: "Study 3 checkpoints exist"

  evaluate:
    # Check for evaluation results
    check_files:
      - "output/disentangled_tmr_eval/evaluation_results.pt"
    description: "Evaluation results exist"
