<!--
  DisentangledTMR — Interactive Architecture (Pure SVG)
  All tensor shapes from source code. viewBox 0 0 1000 980.
-->
<style>
.arch-wrap{position:relative;padding:1.5rem 0}
.arch-controls{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.arch-play-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.2rem;border-radius:8px;border:1px solid var(--accent-border);background:var(--accent-subtle);color:var(--accent);font-family:var(--font-body);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s ease}
.arch-play-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px);box-shadow:var(--shadow-md)}
[data-theme="dark"] .arch-play-btn:hover{color:#0B0B0D}
.arch-play-btn.playing{background:var(--rose);border-color:var(--rose);color:#fff}
.arch-step-label{font-family:var(--font-body);font-size:.82rem;color:var(--text-muted);flex:1;min-width:180px}
.arch-speed{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--text-muted);font-family:var(--font-body)}
.arch-speed select{padding:.25rem .45rem;border-radius:5px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text);font-family:var(--font-mono);font-size:.72rem;cursor:pointer}
.arch-diagram{width:100%;max-width:1100px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.arch-svg{width:100%;height:auto;display:block;min-width:740px}
.arch-info{margin-top:.8rem;padding:.8rem 1rem;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border);font-family:var(--font-body);font-size:.8rem;color:var(--text-muted);line-height:1.55;min-height:2em}
.arch-info .ait{font-weight:700;font-size:.85rem;color:var(--text);margin-bottom:.2rem}
.arch-info .ais{font-family:var(--font-mono);font-size:.72rem;color:var(--text-faint);margin-top:.15rem}
.arch-legend{display:flex;gap:.8rem;margin-top:1rem;flex-wrap:wrap}
.arch-badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-family:var(--font-body);color:var(--text-muted);padding:.25rem .6rem;border-radius:5px;background:var(--bg-surface);border:1px solid var(--border)}
.arch-badge .dot{width:7px;height:7px;border-radius:50%}
.arch-svg .cb{cursor:pointer}
.arch-svg .cb:hover .cbg{filter:brightness(1.08)}
.arch-svg .cb.act .cbg{stroke-width:2.5}
.arch-svg .ist{transition:opacity .25s}
.arch-svg .ist.hl rect{opacity:.3!important}
@media(max-width:768px){.arch-controls{flex-direction:column;align-items:stretch}.arch-step-label{text-align:center}}
</style>

<div class="arch-wrap" id="archWrap">
<div class="arch-controls">
    <button class="arch-play-btn" id="aPlayBtn">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" id="aPlayIco"><polygon points="1,0 12,6 1,12"/></svg>
        <span id="aPlayTxt">Play</span>
    </button>
    <div class="arch-step-label" id="aStepLbl">Click a component or press Play to animate.</div>
    <div class="arch-speed">
        <label>Speed:</label>
        <select id="aSpeedSel"><option value="2200">0.5x</option><option value="1300" selected>1x</option><option value="650">2x</option></select>
    </div>
</div>

    <use href="#skel-a" x="460" y="840" transform="translate(460,840) scale(.5) translate(-460,-840)" opacity=".85"><!-- reuse T-pose but emerald override below --></use>
    <use href="#skel-e" x="560" y="840" transform="translate(560,840) scale(.5) translate(-560,-840)" opacity="1"/>
    <text x="405" y="840" font-size="10" fill="var(--emerald)" opacity=".35">&#8594;</text>
    <text x="505" y="840" font-size="10" fill="var(--emerald)" opacity=".35">&#8594;</text>
    <text x="380" y="870" font-family="var(--font-mono)" font-size="8" fill="var(--text-faint)">T=63 frames (wider body, source action)</text>
</g>

<!-- ═══ PULSE CIRCLES ═══ -->
<circle class="pd" id="pd0" r="5" fill="var(--accent)" opacity="0" filter="url(#gA)"/>
<circle class="pd" id="pd1" r="5" fill="var(--violet)" opacity="0" filter="url(#gV)"/>
<circle class="pd" id="pd2" r="5" fill="var(--accent)" opacity="0" filter="url(#gA)"/>
<circle class="pd" id="pd3" r="5" fill="var(--violet)" opacity="0" filter="url(#gV)"/>
<circle class="pd" id="pd4" r="5" fill="var(--emerald)" opacity="0" filter="url(#gE)"/>
</svg>
</div>

<div class="arch-info" id="aInfo">Click any component above to see detailed tensor shapes and processing details.</div>
<div class="arch-legend">
    <div class="arch-badge"><span class="dot" style="background:var(--accent)"></span>Action path</div>
    <div class="arch-badge"><span class="dot" style="background:var(--violet)"></span>Identity path</div>
    <div class="arch-badge"><span class="dot" style="background:var(--emerald)"></span>Decoder / output</div>
    <div class="arch-badge"><span class="dot" style="background:var(--rose)"></span>Classification (Stage 1)</div>
    <div class="arch-badge"><span class="dot" style="border:1.5px dashed var(--text-faint);background:transparent"></span>Training only</div>
</div>
</div>

<script>
(function(){
"use strict";
var playing=false,timer=null,si=-1,spd=1300,activeCmp=null;
var PATHS=["p0","p1","p2","p3","p4","p6","p7"];
var INFO={
"src":{t:"Source Motion",b:"Person P1 performing action A1. Contains motion dynamics (position, velocity, acceleration) to transfer.",s:"(B, 3, 64, 25, 1) | B=batch, 3=XYZ, 64=frames, 25=NTU joints, 1=person"},
"tgt":{t:"Target Skeleton",b:"Person P2's skeleton sequence. Identity Encoder extracts static pose via temporal mean to capture body proportions.",s:"(B, 3, 64, 25, 1) -> temporal mean -> (B, 3, 25, 1)"},
"ae":{t:"Action Encoder",b:"Multi-scale temporal pipeline: finite-diff velocity/acceleration, parallel convolutions (k=3,5,7), temporal attention (8h) x2, LSTM (2 layers), optional MixFormer backbone with learned gating.",s:"(B,3,64,25,1) -> [pos,vel,acc] -> (B,9,64,25,1) -> Linear(225,256) -> MultiScaleTConv -> TempAttn x2 -> LSTM -> GateFusion -> LayerNorm -> (64, B, 768)"},
"ie":{t:"Identity Encoder",b:"Low-capacity spatial encoder (256D limits identity leakage). 3 GCN layers on NTU bone graph, spatial attention, parallel bone-length MLP (24 bones).",s:"(B,3,64,25,1) -> mean(T) -> Conv2d(3,64) -> GCN x3 -> SpatialAttn(8h) -> Pool -> (B,256) || Bones(24)->MLP->(B,128) -> Concat(384) -> 512 -> 256"},
"dec":{t:"Factorized Decoder",b:"6-layer autoregressive decoder. Each layer: causal self-attn, action cross-attn, identity cross-attn, adaptive fusion gate (g*act + (1-g)*id), FFN. Teacher forcing 1.0->0.3. PhysicalConstraintLayer for bone lengths.",s:"Action: (64,B,768)->Linear->(64,B,320) | Identity: (B,256)->Linear->(B,320) | Seed: Linear(75,320) | Out: Linear(320,75)->reshape->(B,3,63,25,1)"},
"out":{t:"Retargeted Motion",b:"Person P2 performing action A1. Source motion transferred onto target skeleton. T-1 frames (first frame is seed).",s:"(B, 3, 63, 25, 1) | 63 = T-1 frames (autoregressive)"},
"ar":{t:"AR Classifier (Stage 1)",b:"3-layer MLP on temporal mean of action features. Classifies into 60 NTU actions. Training only.",s:"mean(T) of (64,B,768) -> (B,768) -> 512 -> 256 -> 60"},
"ri":{t:"RI Classifier (Stage 1)",b:"3-layer MLP on identity features. Classifies into 40 NTU actors. Adversarial GRL prevents identity leakage into action encoder.",s:"(B,256) -> 512 -> 256 -> 40"}
};
var LABELS=[
"Step 1/15: Source motion (B,3,64,25,1) enters Action Encoder",
"Step 2/15: Velocity + acceleration via finite differences, concat -> (B,9,64,25,1)",
"Step 3/15: Multi-scale temporal convolutions: parallel kernels k=3, k=5, k=7",
"Step 4/15: Temporal attention (8h) x2 + LSTM (2 layers)",
"Step 5/15: Gate fusion with MixFormer backbone -> (64, B, 768)",
"Step 6/15: Target skeleton enters Identity Encoder",
"Step 7/15: Temporal mean + Conv2d + Spatial GCN x3 on skeleton graph",
"Step 8/15: Bone lengths (24) + spatial attention + fusion -> (B, 256)",
"Step 9/15: Action features (64,B,768) flow to Factorized Decoder",
"Step 10/15: Identity features (B,256) flow to Factorized Decoder",
"Step 11/15: Self-attention with causal mask, then parallel cross-attention",
"Step 12/15: Adaptive fusion gate: g*action + (1-g)*identity",
"Step 13/15: Autoregressive generation: seed frame -> t=1...63 with teacher forcing",
"Step 14/15: Output (B,3,63,25,1) — retargeted motion",
"Step 15/15: Stage 1 classification heads: AR (60 actions) + RI (40 identities)"
];
var STEPS=[
{c:["src","ae"],p:["p0"],i:[],pu:{d:"pd0",p:"p0"}},
{c:["ae"],p:[],i:["a1","a2"]},
{c:["ae"],p:[],i:["a3"]},
{c:["ae"],p:[],i:["a4","a5"]},
{c:["ae"],p:[],i:["a6","a7"]},
{c:["tgt","ie"],p:["p1"],i:[],pu:{d:"pd1",p:"p1"}},
{c:["ie"],p:[],i:["i1","i2","i3"]},
{c:["ie"],p:[],i:["i4","i5","i6","i7","i8"]},
{c:["ae","dec"],p:["p2"],i:[],pu:{d:"pd2",p:"p2"}},
{c:["ie","dec"],p:["p3"],i:[],pu:{d:"pd3",p:"p3"}},
{c:["dec"],p:[],i:["d1","d2","d3"]},
{c:["dec"],p:[],i:["d4","d5"]},
{c:["dec"],p:[],i:["d6"]},
{c:["dec","out"],p:["p4"],i:["d7"],pu:{d:"pd4",p:"p4"}},
{c:["ar","ri"],p:["p6","p7"],i:[]}
];

var svg=document.getElementById("aSvg"),info=document.getElementById("aInfo");
var btn=document.getElementById("aPlayBtn"),ico=document.getElementById("aPlayIco"),txt=document.getElementById("aPlayTxt"),lbl=document.getElementById("aStepLbl");

svg.addEventListener("click",function(e){
    var b=e.target.closest(".cb");if(!b)return;
    var c=b.getAttribute("data-c");if(!c||!INFO[c])return;
    var prev=svg.querySelector(".cb.act");if(prev)prev.classList.remove("act");
    if(activeCmp===c){activeCmp=null;info.textContent="Click any component above to see detailed tensor shapes and processing details.";return;}
    activeCmp=c;b.classList.add("act");
    var d=INFO[c];info.textContent="";
    var t=document.createElement("div");t.className="ait";t.textContent=d.t;
    var bd=document.createElement("div");bd.textContent=d.b;
    var s=document.createElement("div");s.className="ais";s.textContent=d.s;
    info.appendChild(t);info.appendChild(bd);info.appendChild(s);
});
btn.addEventListener("click",function(){playing?stop():start()});
document.getElementById("aSpeedSel").addEventListener("change",function(){spd=parseInt(this.value,10)});

function start(){playing=true;si=-1;btn.classList.add("playing");ico.innerHTML='<rect x="1" y="0" width="4" height="12"/><rect x="7" y="0" width="4" height="12"/>';txt.textContent="Stop";next();}
function stop(){playing=false;if(timer){clearTimeout(timer);timer=null;}btn.classList.remove("playing");ico.innerHTML='<polygon points="1,0 12,6 1,12"/>';txt.textContent="Play";clear();lbl.textContent="Click a component or press Play to animate.";}
function next(){if(!playing)return;si++;if(si>=STEPS.length){stop();return;}apply(si);timer=setTimeout(next,spd);}

function apply(idx){
    clear();var s=STEPS[idx];lbl.textContent=LABELS[idx];
    (s.c||[]).forEach(function(n){var el=svg.querySelector('.cb[data-c="'+n+'"]');if(el){el.classList.add("act");var bg=el.querySelector(".cbg");if(bg)bg.style.strokeWidth="2.5";}});
    (s.p||[]).forEach(function(id){var p=document.getElementById(id);if(p){p.style.opacity=".8";p.style.strokeWidth="3";}});
    (s.i||[]).forEach(function(n){var el=svg.querySelector('.ist[data-i="'+n+'"]');if(el){el.classList.add("hl");var r=el.querySelector("rect");if(r){r.setAttribute("data-po",r.getAttribute("opacity")||".07");r.setAttribute("opacity",".25");}}});
    if(s.pu)pulse(s.pu.d,s.pu.p);
}
function clear(){
    svg.querySelectorAll(".cb.act").forEach(function(e){e.classList.remove("act");var bg=e.querySelector(".cbg");if(bg)bg.style.strokeWidth="";});
    PATHS.forEach(function(id){var p=document.getElementById(id);if(p){p.style.opacity="";p.style.strokeWidth="";}});
    svg.querySelectorAll(".ist.hl").forEach(function(e){e.classList.remove("hl");var r=e.querySelector("rect");if(r){var po=r.getAttribute("data-po");if(po)r.setAttribute("opacity",po);}});
    document.querySelectorAll(".pd").forEach(function(d){d.style.opacity="0";});
}
function pulse(did,pid){
    var dot=document.getElementById(did),path=document.getElementById(pid);if(!dot||!path)return;
    var len=path.getTotalLength(),dur=Math.max(350,spd*.5),t0=performance.now();dot.style.opacity="1";
    function tick(now){if(!playing){dot.style.opacity="0";return;}var p=Math.min((now-t0)/dur,1);var pt=path.getPointAtLength(p*len);dot.setAttribute("cx",pt.x);dot.setAttribute("cy",pt.y);dot.style.opacity=String(1-p*.4);if(p<1)requestAnimationFrame(tick);else dot.style.opacity="0";}
    requestAnimationFrame(tick);
}
})();
</script>
